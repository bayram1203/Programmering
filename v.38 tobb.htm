
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Intro</title>
</head>
<body>
  <script src="http://koda.nu/simple.js">
var player = {
    x:400,
    y:300,
    size:40,
    color:"blue",
    speed:5
};

var x = 800;
var y = 200;
var storlek = 50
function update() {
    clearScreen();
    circle(player.x, player.y, player.size, player.color)
    text (50, 50, 40, "x är: " + player.x + " y är: " + player.y)
circle (x, y, storlek, "black")
    if (keyboard.right) {
        player.x = player.x + player.speed;
    }
     if (keyboard.left) {
        player.x = player.x - player.speed;
    }
     if (keyboard.up) {
        player.y = player.y - player.speed;
    }
     if (keyboard.down) {
        player.y = player.y + player.speed;
    }
    if (player.x + player.size > totalWidth){
        player.x = totalWidth - player.size;
    }
     if (player.x - player.size < 0) {
     player.x = 0 + player.size
     }
     if (player.y - player.size < 0) {
        player.y = 0 + player.size
     }
     if (player.y + player.size > totalHeight) {
        player.y = totalHeight - player.size
     }
     if (keyboard.space) {
        player.speed = player.speed * 2
        player.color = mixColor(random(256),random(256),random(256))
     } else {
player.speed =5
     }


if(player.x + player.size * 2 > x){

     if(player.x + player.size * 2 > x) {
        text(50, 100, 40, "krock!")

        }
     }
    }
    

  </script>
</body>
</html>
