var player = {

color:"blue",
speedX: 1,  // km/h /7 med 0, så blir bollen fallande. bollen har 1 riktning
speedY: 0, // km/h // Bollen rör sig upp! Endast Y- koordinaten

directionY: -1
};

var enemy = {
x:500,
y:500,
bredd:50,
hojd:50,
color:"red",
speedX:5,
speedY:0,
directionX:1,
directionY:-1
}


function update() {

clearScreen();
circle(player.x, player.y, player.size, player.color);

player.y = player.y + player.speedY * player.directionY

rectangle(enemy.x, enemy.y, enemy.bredd, enemy.hojd, enemy.color)

// enemy.x= enemy.x + enemy.speedX * enemy.directionX

setTimeout(() => {
  enemy.x = enemy.x + mouse.x / 100
}, 1000)

}
