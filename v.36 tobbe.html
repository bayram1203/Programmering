<body>
  <script src="http://koda.nu/simple.js">

var enemy = {
  x: 100,
  y: 300,
  size: 40,
  color: "pink",
speed: 3
};

var player = { 
x: 50,
y: 200,
size: 40,
color: "black",
speed: 3
};
function update() {

clearScreen();
rectangle(1, 1, 2000, 500,"blue")
rectangle(1,430,2000,500,"grey")

circle(player.x, player.y, player.size, player.color);
player.x = player.x + player.speed;
player.y = player.y + player.speed;



circle(enemy.x, enemy.y, enemy.size, enemy.color);
 enemy.x = enemy.x + enemy.speed;
enemy.y = enemy.y + enemy.speed;



}













  </script>
